<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conversor de Temperatura</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
      border-radius: 20px; padding: 40px; width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
    }
    h1 { text-align: center; margin-bottom: 30px; font-size: 1.5rem; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; opacity: 0.8; }
    input, select {
      width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px;
      border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 1rem;
    }
    input::placeholder { color: rgba(255,255,255,0.5); }
    select option { color: #000; }
    button {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      background: #00d2ff; color: #000; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.3s; margin-bottom: 20px;
    }
    button:hover { background: #00b8d9; }
    .result {
      background: rgba(255,255,255,0.15); padding: 16px; border-radius: 10px;
      text-align: center; font-size: 1.2rem; min-height: 50px; display: flex;
      align-items: center; justify-content: center;
    }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌡️ Conversor de Temperatura</h1>
    <label for="value">Valor:</label>
    <input type="number" id="value" placeholder="Ex: 100">
    <label for="unit">De / Para:</label>
    <select id="unit">
      <option value="cf">Celsius → Fahrenheit</option>
      <option value="fc">Fahrenheit → Celsius</option>
    </select>
    <button onclick="convert()">Converter</button>
    <div class="result" id="result">—</div>
  </div>
  <script>
    async function convert() {
      const value = document.getElementById('value').value;
      const unit = document.getElementById('unit').value;
      const resultEl = document.getElementById('result');
      if (value === '') { resultEl.textContent = 'Insira um valor'; return; }
      try {
        const res = await fetch(`/api/convert?value=${value}&unit=${unit}`);
        const data = await res.json();
        if (data.error) { resultEl.textContent = data.error; resultEl.className = 'result error'; }
        else { resultEl.textContent = data.result; resultEl.className = 'result'; }
      } catch { resultEl.textContent = 'Erro de conexão'; resultEl.className = 'result error'; }
    }
  </script>
</body>
</html>
